<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almoxarifado - Criar Conta</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-box animate-fade-in">
      <h1>Criar Conta</h1>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">Preencha os dados abaixo para se cadastrar.</p>
      
      <form id="registrarForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Cadastrar</button>
        
        <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;">
          <span style="color: var(--text-secondary);">Já tem uma conta? <a href="./index.html" style="color: var(--accent-color); text-decoration: none; font-weight: 500;">Faça Login</a></span>
        </div>
      </form>
    </div>
  </div>
  
  <script type="module" src="./src/registrar.js"></script>
</body>
</html>
