<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almoxarifado - Cadastrar Item</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="dashboard-layout">
  <nav class="navbar">
    <div class="navbar-brand">📦 Almoxarifado</div>
    <div>
      <a href="/dashboard.html" class="btn btn-secondary">Voltar ao Painel</a>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-header animate-fade-in">
      <h2>Cadastrar Novo Item</h2>
    </div>
    
    <div class="glass-panel animate-fade-in" style="max-width: 600px; margin: 0 auto;">
      <form id="cadastroForm">
        <div class="form-group">
          <label for="nome">Nome do Produto</label>
          <input type="text" id="nome" placeholder="Ex: Teclado Mecânico" required>
        </div>
        
        <div class="form-group">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" placeholder="Ex: 5" min="1" required>
        </div>

        <div class="form-group">
          <label for="condicao">Condição</label>
          <select id="condicao" required>
            <option value="" disabled selected>Selecione uma condição</option>
            <option value="Novo">Novo</option>
            <option value="Usado">Usado</option>
          </select>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn" style="flex: 1;">Salvar Item</button>
          <button type="button" id="limparBtn" class="btn btn-secondary" style="flex: 1;">Limpar</button>
        </div>
      </form>
    </div>
  </main>
  
  <script type="module" src="/src/cadastro.js"></script>
</body>
</html>
