<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almoxarifado - Login</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-box animate-fade-in">
      <h1>Almoxarifado</h1>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">Acesse o sistema para gerenciar seu estoque.</p>
      
      <button id="googleLoginBtn" class="btn btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
        Entrar com o Google
      </button>
      
      <div class="divider">ou</div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Entrar</button>
        
        <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;">
          <a href="/esqueci-senha.html" style="color: var(--accent-color); text-decoration: none;">Esqueceu sua senha?</a>
          <span style="color: var(--text-secondary);">Não tem uma conta? <a href="/registrar.html" style="color: var(--accent-color); text-decoration: none; font-weight: 500;">Criar conta</a></span>
        </div>
      </form>
    </div>
  </div>
  
  <script type="module" src="/src/login.js"></script>
</body>
</html>
